<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <rect width="1100" height="720" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">RideUJAP  Diagrama Entidad-Relación</text>
  <text x="550" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Basado en rideujap-create-tables.sql (PostgreSQL)</text>

  <!-- Usuario -->
  <g>
    <rect x="60" y="120" width="280" height="340" rx="10" fill="#ffffff" stroke="#0b6e4f" stroke-width="2.5"/>
    <rect x="60" y="120" width="280" height="40" rx="10" fill="#0b6e4f"/>
    <rect x="60" y="145" width="280" height="15" fill="#0b6e4f"/>
    <text x="200" y="147" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Usuario</text>
    <text x="78" y="185" font-family="Consolas, monospace" font-size="13" fill="#0f172a"><tspan font-weight="700" fill="#b45309">PK</tspan>  id SERIAL</text>
    <line x1="70" y1="198" x2="330" y2="198" stroke="#e2e8f0"/>
    <text x="78" y="222" font-family="Consolas, monospace" font-size="12" fill="#334155">nombre VARCHAR(120)</text>
    <text x="78" y="244" font-family="Consolas, monospace" font-size="12" fill="#334155">correo VARCHAR(180) UK</text>
    <text x="78" y="266" font-family="Consolas, monospace" font-size="12" fill="#334155">telefono VARCHAR(40)</text>
    <text x="78" y="288" font-family="Consolas, monospace" font-size="12" fill="#334155">esConductor BOOLEAN</text>
    <text x="78" y="310" font-family="Consolas, monospace" font-size="12" fill="#334155">placa VARCHAR(20)</text>
    <text x="78" y="332" font-family="Consolas, monospace" font-size="12" fill="#334155">marcaVehiculo VARCHAR(60)</text>
    <text x="78" y="354" font-family="Consolas, monospace" font-size="12" fill="#334155">modeloVehiculo VARCHAR(60)</text>
    <text x="78" y="376" font-family="Consolas, monospace" font-size="12" fill="#334155">colorVehiculo VARCHAR(40)</text>
    <text x="78" y="398" font-family="Consolas, monospace" font-size="12" fill="#334155">puestosVehiculo INTEGER</text>
    <text x="78" y="420" font-family="Consolas, monospace" font-size="12" fill="#334155">creadoEn TIMESTAMP</text>
  </g>

  <!-- Viaje -->
  <g>
    <rect x="740" y="100" width="300" height="420" rx="10" fill="#ffffff" stroke="#0b6e4f" stroke-width="2.5"/>
    <rect x="740" y="100" width="300" height="40" rx="10" fill="#0b6e4f"/>
    <rect x="740" y="125" width="300" height="15" fill="#0b6e4f"/>
    <text x="890" y="127" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Viaje</text>
    <text x="758" y="165" font-family="Consolas, monospace" font-size="13" fill="#0f172a"><tspan font-weight="700" fill="#b45309">PK</tspan>  id SERIAL</text>
    <line x1="750" y1="178" x2="1030" y2="178" stroke="#e2e8f0"/>
    <text x="758" y="202" font-family="Consolas, monospace" font-size="12" fill="#334155">origen VARCHAR(200)</text>
    <text x="758" y="224" font-family="Consolas, monospace" font-size="12" fill="#334155">destino VARCHAR(200)</text>
    <text x="758" y="246" font-family="Consolas, monospace" font-size="12" fill="#334155">puntoEncuentro VARCHAR(200)</text>
    <text x="758" y="268" font-family="Consolas, monospace" font-size="12" fill="#334155">fecha VARCHAR(20)</text>
    <text x="758" y="290" font-family="Consolas, monospace" font-size="12" fill="#334155">hora VARCHAR(10)</text>
    <text x="758" y="312" font-family="Consolas, monospace" font-size="12" fill="#334155">cuposTotal INTEGER</text>
    <text x="758" y="334" font-family="Consolas, monospace" font-size="12" fill="#334155">cuposDisponibles INTEGER</text>
    <text x="758" y="356" font-family="Consolas, monospace" font-size="12" fill="#334155">descripcionVehiculo VARCHAR</text>
    <text x="758" y="378" font-family="Consolas, monospace" font-size="12" fill="#334155">estado VARCHAR(40)</text>
    <text x="758" y="400" font-family="Consolas, monospace" font-size="12" fill="#334155">origenLat / origenLng</text>
    <text x="758" y="422" font-family="Consolas, monospace" font-size="12" fill="#334155">destinoLat / destinoLng</text>
    <text x="758" y="444" font-family="Consolas, monospace" font-size="12" fill="#334155">creadoEn TIMESTAMP</text>
    <text x="758" y="470" font-family="Consolas, monospace" font-size="13" fill="#0f172a"><tspan font-weight="700" fill="#2563eb">FK</tspan>  idConductor ’ Usuario.id</text>
  </g>

  <!-- PasajeroViaje -->
  <g>
    <rect x="380" y="520" width="340" height="160" rx="10" fill="#ffffff" stroke="#0b6e4f" stroke-width="2.5"/>
    <rect x="380" y="520" width="340" height="40" rx="10" fill="#047857"/>
    <rect x="380" y="545" width="340" height="15" fill="#047857"/>
    <text x="550" y="547" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">PasajeroViaje</text>
    <text x="398" y="585" font-family="Consolas, monospace" font-size="13" fill="#0f172a"><tspan font-weight="700" fill="#b45309">PK</tspan>  id SERIAL</text>
    <line x1="390" y1="598" x2="710" y2="598" stroke="#e2e8f0"/>
    <text x="398" y="622" font-family="Consolas, monospace" font-size="12" fill="#334155">unidoEn TIMESTAMP</text>
    <text x="398" y="646" font-family="Consolas, monospace" font-size="13" fill="#0f172a"><tspan font-weight="700" fill="#2563eb">FK</tspan>  idUsuario ’ Usuario.id</text>
    <text x="398" y="670" font-family="Consolas, monospace" font-size="13" fill="#0f172a"><tspan font-weight="700" fill="#2563eb">FK</tspan>  idViaje ’ Viaje.id</text>
  </g>

  <!-- Relación 1:N Usuario -> Viaje (publica) -->
  <path d="M340 250 C480 230, 620 220, 740 220" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="500" y="212" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">publica (conductor)</text>
  <text x="360" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">1</text>
  <text x="720" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">N</text>

  <!-- Relación Usuario -> PasajeroViaje -->
  <path d="M200 460 L200 600 L380 600" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="210" y="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">se une</text>
  <text x="185" y="475" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">1</text>
  <text x="360" y="590" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">N</text>

  <!-- Relación Viaje -> PasajeroViaje -->
  <path d="M890 520 L890 600 L720 600" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="900" y="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">tiene pasajeros</text>
  <text x="900" y="535" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">1</text>
  <text x="730" y="590" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">N</text>

  <!-- Leyenda -->
  <rect x="60" y="640" width="280" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="75" y="662" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Leyenda</text>
  <text x="75" y="682" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#334155">1:N conductorviajes · N:M viajeroviaje (puente)</text>
</svg>
